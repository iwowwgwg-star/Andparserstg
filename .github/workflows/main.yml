name: Telegram to VK Parser

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run parser script
      env:
        VK_TOKEN: ${{ secrets.VK_TOKEN }}
        GROUP_ID: ${{ secrets.GROUP_ID }}
        TG_CHANNEL: "andparserstg"
      run: |
        python main.py

    - name: Commit and push if history changed
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add sent_posts.json || true
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update sent posts history [skip ci]" && git push)
