name: Telegram to VK Bot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Обязательные права для записи изменений скрипта обратно в репозиторий
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install vk_api requests beautifulsoup4 yt-dlp

      - name: Run bot script
        env:
          TZ: 'Europe/Moscow'
        run: |
          python main.py
