name: Run Telegram to VK Bot

on:
  # Запускай по расписанию (например, каждые 30 минут) или вручную
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем репозиторий
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Устанавливаем Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # 3. Устанавливаем зависимости
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install vk_api requests beautifulsoup4

      # 4. Запускаем скрипт
      - name: Run script
        run: python main.py

      # 5. Автоматически сохраняем обновленный processed.txt в репозиторий
      - name: Commit processed posts
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update processed posts database [skip ci]"
          file_pattern: processed.txt
