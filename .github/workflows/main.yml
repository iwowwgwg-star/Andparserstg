name: Telegram to VK Bot

on:
  schedule:
    # Запускает скрипт каждые 15 минут (можешь изменить интервал по вкусу)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Позволяет запускать воркфлов вручную кнопкой в интерфейсе GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install vk_api requests beautifulsoup4 yt-dlp

      - name: Run bot script
        env:
          # Если захочешь вынести токен в Secrets, можно настроить тут, 
          # но сейчас он зашит прямо в main.py, так что скрипт отработает сразу.
          TZ: 'Europe/Moscow'
        run: |
          python main.py
