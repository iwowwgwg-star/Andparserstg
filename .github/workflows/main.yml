name: Run Telegram to VK Bot

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install vk_api requests beautifulsoup4

      - name: Run script
        run: python main.py

      - name: Commit processed posts
        uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          message: "Auto-update processed posts database"
          add: "processed.txt"
