name: TG to VK Bot

on:
  schedule:
    - cron: '*/15 * * * *' # Запуск каждые 15 минут
  workflow_dispatch: # Возможность запустить вручную

jobs:
  build:
  runs-on: ubuntu-latest

  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install vk_api requests beautifulsoup4

    - name: Run script
      run: |
        python main.py

    - name: Save processed file to repository
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add processed.txt
        git commit -m "Update processed posts [skip ci]" || echo "No changes to commit"
        git push
